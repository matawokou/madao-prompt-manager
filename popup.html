<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Prompt Manager</title>
<link rel="stylesheet" href="common.css">
<style>
body{width:380px;max-height:560px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
header b{font-size:14px}
.searchwrap{padding:10px 14px}
.search{width:100%}
#list{max-height:390px;overflow-y:auto;padding:0 10px 10px}
.item{padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff}
.item h4{font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .row{margin-top:7px}
footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
footer .btn{flex:1;justify-content:center}
#status{padding:16px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <b>Prompt Manager</b>
  <span class="badge" id="count">加载中…</span>
</header>
<div class="searchwrap">
  <input class="search" id="q" placeholder="搜索标题、内容、标签…" autofocus>
</div>
<div id="list"><div id="status">读取数据中…</div></div>
<footer>
  <button class="btn" id="open-manager">管理页</button>
  <button class="btn primary" id="open-side">侧边栏</button>
</footer>
<script src="lib/ui.js"></script>
<script src="lib/storage.js"></script>
<script src="popup.js"></script>
</body>
</html>
