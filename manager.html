<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Prompt Manager · 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<link rel="stylesheet" href="common.css">
<style>

/* ============ 设计令牌：工作室档案库 ============ */
:root{
  --bg:#faf9f6;            /* 暖纸白主区 */
  --card:#ffffff;
  --ink:#262a31;           /* 墨青近黑正文 */
  --muted:#8a8578;         /* 暖灰次要文字 */
  --line:#e7e4dc;
  --accent:#e8a03c;        /* 琥珀强调（唯一强调色） */
  --accent-ink:#3d2e10;
  --pine:#20242e;          /* 墨青侧栏底 */
  --pine-text:#e9e6df;
  --pine-muted:#9aa0ad;
  --err:#c8452c;
  --ok:#3e8f5f;
  --radius:14px;
  --hover:#f1efe8;         /* 悬停底 */
  --hover-line:#d8d4c8;
  --panel:#fffdfd;         /* 弹窗 / 菜单底 */
  --input-bg:#ffffff;
  --thumb-bg:#f1efe8;      /* 缩略图 / 徽章底 */
  --thumb-line:#d9d3c2;
  --stripe1:#f4f2ec;       /* 无图占位条纹 */
  --stripe2:#f0eee7;
  --noimg-t:#c0bab0;
  --content-t:#6d6a60;     /* 卡片正文 */
  --diag-bg:#f6f5f0;
  --scroll:#d9d4c8;        /* 滚动条 */
  --shadow-1:0 1px 3px rgba(38,42,49,.08);
  --shadow-2:0 8px 28px rgba(38,42,49,.14);
  --shadow-3:0 24px 64px rgba(38,42,49,.22);
  --ease:cubic-bezier(.16,1,.3,1);
}
/* ============ 深色主题：墨夜档案库 ============ */
body.dark{
  --bg:#191b20;            /* 暖炭黑主区 */
  --card:#20232b;
  --ink:#e8e4da;           /* 暖米白正文 */
  --muted:#938d7f;
  --line:#2e323c;
  --accent:#e8a03c;
  --accent-ink:#f2c069;
  --pine:#13151a;          /* 侧栏压得更深 */
  --pine-text:#d9d5cb;
  --pine-muted:#7e8492;
  --err:#e0704f;
  --ok:#5dbd82;
  --hover:#262a33;
  --hover-line:#3a3f4a;
  --panel:#1e2128;
  --input-bg:#171a1f;
  --thumb-bg:#23262e;
  --thumb-line:#3a3f4a;
  --stripe1:#22252d;
  --stripe2:#1e2128;
  --noimg-t:#5b5f6a;
  --content-t:#a9a598;
  --diag-bg:#1a1d23;
  --scroll:#3a3f4a;
  --shadow-1:0 1px 3px rgba(0,0,0,.45);
  --shadow-2:0 8px 28px rgba(0,0,0,.55);
  --shadow-3:0 24px 64px rgba(0,0,0,.65);
}
/* 覆盖 common.css 的浅色令牌，保持类兼容 */
body{--text:var(--ink);--primary:#c47b1e;--primary2:#e8a03c}
body.dark{--primary:#e8a03c}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font-family:"Bricolage Grotesque","Segoe UI","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
}
button{font-family:inherit;cursor:pointer}

/* ============ 顶栏 ============ */
header{
  display:flex;align-items:center;gap:10px;padding:14px 22px;flex-wrap:wrap;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.logo-wrap{
  display:flex;align-items:center;margin-right:10px;position:relative;
  border:1.5px solid #9a7a3f;border-radius:10px;
  padding:9px 20px;
  background:linear-gradient(165deg,#fdfaf1,#f3e9cf 60%,#ecdcb4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(138,98,36,.25),0 3px 8px rgba(90,66,17,.18);
}
.logo-wrap::after{
  content:'';position:absolute;inset:3px;border:1px solid rgba(154,122,63,.35);
  border-radius:7px;pointer-events:none;
}
.logo-mark{
  font-size:21px;font-weight:700;letter-spacing:.07em;line-height:1;
  background:linear-gradient(180deg,#ecd28a 8%,#c79b45 38%,#966f28 78%,#7c581e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:
    drop-shadow(0 1px 0 rgba(255,243,214,.85))
    drop-shadow(0 2px 0 #a17c33)
    drop-shadow(0 3px 0 #6e4d15)
    drop-shadow(0 4px 5px rgba(70,45,5,.35));
}
header h1::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:2px}
header .badge{background:transparent;border:1px dashed var(--line);color:var(--muted)}
header .badge.wordmark{
  background:transparent;border:none;color:#5b3a1e;
  font-size:19px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:0;line-height:1;
  text-decoration:underline;text-decoration-color:rgba(154,122,63,.65);
  text-underline-offset:6px;text-decoration-thickness:2px;
}
.spacer{flex:1}

/* ============ 按钮（覆盖 common）============ */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:var(--ink);font-size:13px;
  transition:background .15s,border-color .15s,transform .15s var(--ease);
}
.btn:hover{background:var(--hover);border-color:var(--hover-line)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3a3f49}
body.dark .btn.primary:hover{background:#454b57}
/* 深色下主按钮反转：暖米白底 + 深字（否则 var(--ink) 反转成浅底白字看不清） */
body.dark .btn.primary{background:#e8e4da;color:#191b20;border-color:#e8e4da}
body.dark .btn.ok{background:#5dbd82}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.err{background:transparent;color:var(--err);border-color:var(--err)}
.btn.err:hover{background:var(--err);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input,.search{padding:9px 13px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--input-bg);color:var(--ink);outline:none;transition:border-color .15s}
.input:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,160,60,.15)}

/* ============ 布局 ============ */
.layout{flex:1;display:flex;min-height:0}

/* ============ 侧栏：墨青 ============ */
aside{
  width:232px;flex-shrink:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--pine),#1b1f27);
  color:var(--pine-text);
}
aside .hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 10px;font-size:11px;font-weight:600;letter-spacing:.12em;
  color:var(--pine-muted);text-transform:uppercase;
}
aside .hd .actions{display:flex;gap:2px}
aside .hd button{border:none;background:none;color:var(--pine-muted);padding:3px 7px;cursor:pointer;font-size:15px;border-radius:6px}
aside .hd button:hover{background:rgba(255,255,255,.08);color:var(--pine-text)}
#cats{flex:1;overflow-y:auto;padding:2px 10px 12px}
#cats::-webkit-scrollbar{width:8px}
#cats::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.cat{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:2px;
  user-select:none;color:var(--pine-text);position:relative;
  transition:background .15s;
}
.cat:hover{background:rgba(255,255,255,.06)}
.cat.on{background:rgba(232,160,60,.14);color:#f5c881;font-weight:600}
.cat.on::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.cat-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.child{padding-left:24px}
.cat.child .cat-name{color:var(--pine-muted);font-size:12px}
.cat.on.child .cat-name{color:#f5c881}
.cat-toggle{width:15px;flex:0 0 15px;font-size:9px;color:var(--pine-muted);cursor:pointer;text-align:center}
.cat-toggle.none{visibility:hidden}
.cat.child .cat-toggle{display:none}
.cat .n{font-size:11px;color:var(--pine-muted);background:rgba(255,255,255,.08);border-radius:9px;padding:1px 8px;font-variant-numeric:tabular-nums}
.cat.on .n{background:rgba(232,160,60,.22);color:#f5c881}
.cat-sort{padding:8px 12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:5px}
.cat-sort .btn{flex:1;font-size:11px;padding:5px 4px;justify-content:center;background:transparent;color:var(--pine-muted);border-color:rgba(255,255,255,.14)}
.cat-sort .btn:hover{background:rgba(255,255,255,.08);color:var(--pine-text)}
.foldersec{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px;font-size:12px;color:var(--pine-muted)}
.foldersec .st{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.dot{width:8px;height:8px;border-radius:50%;background:#565b66;display:inline-block}
.dot.on{background:#5dbd82;box-shadow:0 0 6px rgba(93,189,130,.5)}
.foldersec button{width:100%;margin-bottom:5px;font-size:12px;padding:6px;background:transparent;color:var(--pine-muted);border-color:rgba(255,255,255,.14)}
.foldersec button:hover{background:rgba(255,255,255,.08);color:var(--pine-text)}
.backupsec{border-top:1px solid rgba(255,255,255,.08);padding:11px 14px;display:flex;align-items:center;gap:8px}
.backupsec label{cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;color:var(--pine-muted);font-size:12px}
.backupsec input{accent-color:var(--accent)}

/* ============ 主区 ============ */
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.toolbar{display:flex;gap:8px;align-items:center;padding:14px 20px 10px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:220px;border-radius:10px}
.stats{padding:0 20px 8px;color:var(--muted);font-size:12px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}

/* 批量栏：琥珀条 */
.batchbar{
  display:none;align-items:center;gap:8px;padding:9px 20px;font-size:13px;
  background:linear-gradient(90deg,rgba(232,160,60,.16),rgba(232,160,60,.06));
  border-top:1px solid rgba(196,123,30,.35);border-bottom:1px solid rgba(196,123,30,.35);
  color:var(--accent-ink);
}
.batchbar.show{display:flex;animation:barIn .25s var(--ease)}
@keyframes barIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.batchbar .btn{background:#fffdf8;border-color:rgba(196,123,30,.3)}
.batchbar b{color:var(--primary)}

/* ============ 卡片网格 ============ */
.gridwrap{flex:1;overflow-y:auto;padding:4px 20px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:var(--shadow-1);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s;
}
.item:hover{transform:translateY(-3px);border-color:var(--thumb-line);box-shadow:var(--shadow-2)}
.item.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,160,60,.35),var(--shadow-1)}
.thumb{width:100%;height:135px;object-fit:contain;object-position:center;background:var(--thumb-bg);display:block;cursor:pointer}
.noimg{
  width:100%;height:135px;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,var(--stripe1) 0 10px,var(--stripe2) 10px 20px);
  color:var(--noimg-t);font-size:12px;letter-spacing:.15em;
}
.item .body{padding:12px 13px;flex:1;display:flex;flex-direction:column}
.item h3{font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px;font-weight:600;color:var(--ink)}
.item .content{font-size:12px;color:var(--content-t);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;flex:1}
.item .meta{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.catbtn{
  display:inline-block;padding:2px 9px;border-radius:10px;background:transparent;
  color:var(--primary);font-size:11px;cursor:pointer;border:1px solid rgba(196,123,30,.4);
  transition:all .15s;
}
.catbtn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--thumb-bg);color:var(--muted);font-size:11px}
.fav{
  position:absolute;right:9px;top:9px;background:rgba(255,255,255,.92);border:none;border-radius:50%;
  width:27px;height:27px;color:#c9c3b8;font-size:14px;cursor:pointer;z-index:2;
  transition:transform .15s var(--ease),color .15s;
}
.fav:hover{transform:scale(1.12)}
.fav.on{color:#e5a819}
.selcb{
  position:absolute;left:9px;top:9px;z-index:2;width:18px;height:18px;cursor:pointer;
  accent-color:var(--accent);margin:0;border-radius:4px;
  background:rgba(255,255,255,.92);box-shadow:var(--shadow-1);
}

#empty{padding:70px;text-align:center;color:var(--muted);display:none;font-size:14px;letter-spacing:.05em}

/* ============ 弹窗 ============ */
.modal{position:fixed;inset:0;background:rgba(32,36,46,.45);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{
  background:var(--panel);border-radius:16px;padding:24px;width:100%;max-height:90vh;overflow:auto;
  box-shadow:var(--shadow-3);animation:boxIn .28s var(--ease);
}
@keyframes boxIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal .box.lg{max-width:740px}.modal .box.md{max-width:540px}.modal .box.sm{max-width:430px}
.modal h2{font-size:16px;margin-bottom:16px;letter-spacing:-.01em}
.modal h2::after{content:'';display:block;width:28px;height:3px;border-radius:2px;background:var(--accent);margin-top:8px}
.f{width:100%;margin-bottom:10px}
textarea.f{min-height:240px;resize:vertical;line-height:1.65}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.imgprev{max-height:150px;margin:6px 0;border-radius:10px;display:none}
#file{display:none}

/* 日志 */
.log{
  background:var(--pine);color:#d8e0d2;border-radius:10px;padding:10px 14px;
  font:12px/1.6 Consolas,monospace;max-height:130px;overflow:auto;white-space:pre-wrap;
  margin:0 20px 12px;display:none;
}

/* ============ 右键菜单 / 弹层 ============ */
#cat-menu,#card-menu,#move-menu{
  position:fixed;z-index:300;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-2);padding:5px;display:none;min-width:172px;
}
#cat-menu .mi,#card-menu .mi,#move-menu .mi{
  padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--ink);
  transition:background .12s;
}
#cat-menu .mi:hover,#card-menu .mi:hover,#move-menu .mi:hover{background:var(--hover)}
#cat-menu .mi.danger,#card-menu .mi.danger{color:var(--err)}
#cat-menu .sep,#card-menu .sep,#move-menu .sep{height:1px;background:var(--line);margin:4px 6px}
#move-menu{max-height:340px;overflow-y:auto;min-width:168px}
#move-menu .mi.grp{font-weight:600}
#move-menu .mi.sub{padding-left:27px;color:var(--content-t)}

/* 清理清单 */
#clean-list .ci{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;font-size:12px}
#clean-list .ci:hover{background:var(--hover)}
#clean-list .ci .t{font-weight:600;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
#clean-list .ci .c{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#clean-list .ci .cat-tag{color:var(--primary);white-space:nowrap;font-size:11px}

/* 诊断 */
#diag-out{
  max-height:340px;overflow:auto;background:var(--diag-bg);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:12px;line-height:1.7;white-space:pre-wrap;margin:0 0 8px;
  font-family:Consolas,monospace;color:var(--ink);
}

/* 滚动条 */
.gridwrap::-webkit-scrollbar,.modal .box::-webkit-scrollbar,#diag-out::-webkit-scrollbar{width:10px}
.gridwrap::-webkit-scrollbar-thumb,.modal .box::-webkit-scrollbar-thumb,#diag-out::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px;border:2px solid var(--bg)}

/* 动效降级 */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
/* ============ 深色主题组件微调 ============ */
body.dark .fav{background:rgba(32,36,46,.92)}
body.dark .selcb{background:rgba(32,36,46,.92)}
body.dark .batchbar{background:linear-gradient(90deg,rgba(232,160,60,.14),rgba(232,160,60,.05));border-color:rgba(232,160,60,.3)}
body.dark .batchbar .btn{background:#20232b;border-color:rgba(232,160,60,.3)}
body.dark .logo-wrap{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(138,98,36,.3),0 3px 10px rgba(0,0,0,.5)}
body.dark #cat-menu .mi,body.dark #card-menu .mi,body.dark #move-menu .mi{color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="logo-wrap">
    <span class="logo-mark">MADAO</span>
  </div>
  <span class="badge wordmark" id="dbinfo">Prompt Manager</span>
  <div class="spacer"></div>
  <button class="btn" id="btn-theme" title="切换深色 / 浅色">🌙</button>
  <button class="btn" id="btn-cat-manage">管理分类</button>
  <button class="btn" id="btn-import">导入 JSON</button>
  <button class="btn" id="btn-export">导出</button>
  <button class="btn primary" id="btn-new">＋ 新建</button>
</header>

<div class="layout">
  <aside>
    <div class="hd">
      <span>分类（右键管理）</span>
      <div class="actions">
        <button id="btn-cat-manage2" title="管理分类">⋯</button>
      </div>
    </div>
    <div id="cats"></div>
    <div class="cat-sort">
      <button class="btn" id="btn-sort-alpha">字母序</button>
      <button class="btn" id="btn-sort-count">数量序</button>
    </div>
    <div class="foldersec">
      <div class="st"><span class="dot" id="fs-dot"></span><span id="fs-text">未连接文件夹</span></div>
      <button class="btn" id="btn-folder">连接文件夹</button>
      <button class="btn" id="btn-sync">从文件夹同步</button>
      <button class="btn" id="btn-export-folder">导出到文件夹</button>
    </div>
    <div class="backupsec">
      <label><input type="checkbox" id="auto-backup-toggle"> 自动备份</label>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <input class="search" id="q" placeholder="搜索标题、内容、标签…">
      <button class="btn" id="btn-sort">排序：最新</button>
      <button class="btn" id="btn-diag">通道诊断</button>
      <button class="btn" id="btn-nsfw">内容审查：关</button>
      <button class="btn err" id="btn-clear">清空</button>
    </div>
    <div class="batchbar" id="batchbar">
      <span>已选 <b id="batch-n">0</b> 项</span>
      <button class="btn sm" id="btn-batch-selectall">全选</button>
      <button class="btn sm" id="btn-batch-copy">复制所选</button>
      <button class="btn sm" id="btn-batch-move">移动到分类</button>
      <button class="btn sm err" id="btn-batch-delete">删除所选</button>
      <div style="flex:1"></div>
      <button class="btn sm" id="btn-batch-exit">取消选择</button>
    </div>
    <div class="stats" id="stats">加载中…</div>
    <div class="log" id="log"></div>
    <div class="gridwrap">
      <div class="grid" id="grid"></div>
      <div id="empty">没有提示词。点右上角「＋ 新建」，或「导入 JSON」恢复备份。</div>
    </div>
  </main>
</div>

<input type="file" id="file" accept=".json,.csv" multiple>

<div class="modal" id="edit-modal">
  <div class="box lg">
    <h2 id="edit-title-h">新建提示词</h2>
    <input class="input f" id="e-title" placeholder="标题">
    <textarea class="input f" id="e-content" placeholder="提示词内容，支持 {{变量}} 语法"></textarea>
    <div class="muted" id="e-varhint" style="margin-bottom:8px"></div>
    <div class="row">
      <select class="input f" id="e-cat" style="flex:1"></select>
      <input class="input f" id="e-tags" placeholder="标签（逗号分隔）" style="flex:1">
    </div>
    <div class="row" style="margin-bottom:8px">
      <input type="file" id="e-img" accept="image/*" style="display:none">
      <button class="btn" id="e-img-btn">上传封面图</button>
      <button class="btn" id="e-img-rm" style="display:none">移除封面图</button>
      <span class="muted">支持粘贴图片（Ctrl+V）</span>
    </div>
    <img class="imgprev" id="e-img-preview">
    <div class="foot">
      <button class="btn" id="e-cancel">取消</button>
      <button class="btn" id="e-comfy">发送到 ComfyUI（替换）</button>
      <button class="btn" id="e-comfy-append">发送到 ComfyUI（追加）</button>
      <button class="btn primary" id="e-save">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="cat-modal">
  <div class="box md">
    <h2>管理分类</h2>
    <div id="cm-list"></div>
    <div class="foot">
      <button class="btn" id="cm-del-empty">删除空分类</button>
      <button class="btn primary" id="cm-close">完成</button>
    </div>
  </div>
</div>

<div class="modal" id="merge-modal">
  <div class="box sm">
    <h2>合并分类</h2>
    <div class="muted" style="margin-bottom:10px">把 <b id="merge-src"></b> 的全部提示词移到：</div>
    <select class="input f" id="merge-target"></select>
    <div class="foot">
      <button class="btn" id="merge-cancel">取消</button>
      <button class="btn primary" id="merge-ok">合并</button>
    </div>
  </div>
</div>

<div class="modal" id="catmove-modal">
  <div class="box sm">
    <h2>移动为子分类</h2>
    <div class="muted" style="margin-bottom:10px">把 <b id="catmove-src"></b> 挂到父分类下面：</div>
    <select class="input f" id="catmove-target"></select>
    <div class="foot">
      <button class="btn" id="catmove-cancel">取消</button>
      <button class="btn primary" id="catmove-ok">移动</button>
    </div>
  </div>
</div>

<div class="modal" id="clean-modal">
  <div class="box sm">
    <h2>清理超短提示词</h2>
    <div class="muted" style="margin-bottom:8px" id="clean-info"></div>
    <div class="row" style="margin-bottom:8px;align-items:center">
      <span class="muted">判定阈值：内容长度 ≤</span>
      <input type="number" class="input" id="clean-len" min="1" max="999" style="width:78px;padding:5px 9px">
      <span class="muted">字</span>
      <button class="btn sm" id="clean-rescan">重新扫描</button>
    </div>
    <div id="clean-list" style="max-height:380px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:8px"></div>
    <div class="foot">
      <button class="btn" id="clean-toggle">全不选</button>
      <button class="btn" id="clean-cancel">取消</button>
      <button class="btn err" id="clean-ok">删除选中</button>
    </div>
  </div>
</div>

<div class="modal" id="diag-modal">
  <div class="box sm">
    <h2>ComfyUI 通道诊断</h2>
    <pre id="diag-out" style="max-height:340px;overflow:auto;background:var(--diag-bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;margin:0 0 8px">检测中…</pre>
    <div class="foot">
      <button class="btn" id="diag-copy">复制结果</button>
      <button class="btn primary" id="diag-close">关闭</button>
    </div>
  </div>
</div>

<div class="modal" id="export-modal">
  <div class="box sm">
    <h2>导出</h2>
    <button class="btn f" id="exp-json" style="justify-content:center">导出 JSON（含全部字段）</button>
    <button class="btn f" id="exp-csv" style="justify-content:center">导出 CSV（表格）</button>
    <div class="foot"><button class="btn" id="exp-cancel">取消</button></div>
  </div>
</div>

<div id="move-menu"></div>
<div id="cat-menu"></div>
<div id="card-menu"></div>

<script src="lib/ui.js"></script>
<script src="lib/storage.js"></script>
<script src="manager.js"></script>
</body>
</html>
