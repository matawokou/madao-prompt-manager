<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提示词侧边栏</title>
<link rel="stylesheet" href="common.css">
<style>
body{height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
header b{font-size:14px}
.searchwrap{padding:10px 12px}
.search{width:100%}
#cats{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px;max-height:76px;overflow-y:auto}
#list{flex:1;overflow-y:auto;padding:0 12px 12px}
.item{padding:10px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;cursor:pointer}
.item:hover{border-color:var(--primary2)}
.item h4{font-size:13px;margin-bottom:4px}
.item p{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .row{margin-top:7px}
#status{padding:20px;text-align:center;color:var(--muted);font-size:13px}
footer{padding:9px 12px;border-top:1px solid var(--line)}
footer .btn{width:100%;justify-content:center}
</style>
</head>
<body>
<header>
  <b>提示词</b>
  <span class="badge" id="count">…</span>
</header>
<div class="searchwrap"><input class="search" id="q" placeholder="搜索提示词…"></div>
<div id="cats"></div>
<div id="list"><div id="status">读取数据中…</div></div>
<footer><button class="btn" id="new">＋ 新建提示词</button></footer>
<script src="lib/ui.js"></script>
<script src="lib/storage.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
